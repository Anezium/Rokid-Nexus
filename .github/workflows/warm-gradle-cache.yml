name: Warm Gradle cache

# Release workflows run on tag refs, which can read caches from the default
# branch but never from other tags — so unless something on main saves a
# Gradle cache, every release builds completely cold (~4.5 minutes of
# downloading and compiling). This job builds the two hub APKs on every push
# to main and saves the Gradle home and build cache, so a release that
# follows is mostly cache hits plus packaging and signing.

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: warm-gradle-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          path: RokidNexus

      - name: Check out CxrGlobal 0.3.0
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.3.0
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build the hub APKs (unsigned) to fill the cache
        shell: bash
        run: ./gradlew :phone-hub:assembleRelease :glasses-hub:assembleRelease
