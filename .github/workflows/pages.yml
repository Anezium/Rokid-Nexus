name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site reuses the screenshots that already live with the docs, so
      # they are copied in at build time rather than duplicated in git.
      - name: Collect assets
        run: |
          mkdir -p site/assets
          cp docs/assets/*.png site/assets/
          cp -r docs/assets/nexus-2 site/assets/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
