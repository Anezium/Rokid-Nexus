name: Tests

# Pull requests and main run the unit tests of every module. sdk.yml covers
# the public SDK modules; this workflow covers what actually ships to users: the
# two hubs (which need the vendor CXR library) and every plugin. Tags have their
# own release checks and must not start another copy of the entire CI suite.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  line:
    name: LINE native engine and Android plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Read the pinned Go toolchain
        id: line-go
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^toolchain[[:space:]]+go([0-9.]+)\r?$/\1/p' plugins/line/native/go.mod)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.line-go.outputs.version }}
          cache-dependency-path: plugins/line/native/go.sum
      - uses: android-actions/setup-android@v3
      - name: Provision the CI NDK
        run: sdkmanager "ndk;27.1.12297006"
      - name: Test and build the embedded engine
        working-directory: plugins/line/native
        run: |
          go test ./mobile
          go vet ./mobile
          bash build-android.sh
      - name: Test and assemble the phone plugin
        run: ./gradlew :plugin-line:testDebugUnitTest :plugin-line:assembleDebug -PskipCxrGlobal=true

  hubs:
    name: Hub unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RokidNexus
    steps:
      - name: Check out the revision
        uses: actions/checkout@v6
        with:
          path: RokidNexus

      - name: Check out CxrGlobal 0.3.0
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.3.0
          path: CxrGlobal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build the hub release variants
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :phone-hub:testReleaseUnitTest :glasses-hub:testReleaseUnitTest \
            :phone-hub:assembleRelease :glasses-hub:assembleRelease \
            -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false

  plugins:
    name: Plugin unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the revision
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run every plugin's unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :plugin-assistant:testReleaseUnitTest \
            :plugin-relay:testReleaseUnitTest \
            :plugin-lens:testReleaseUnitTest \
            :plugin-lyrics:testReleaseUnitTest \
            :plugin-transit:testReleaseUnitTest \
            :plugin-nav:testReleaseUnitTest \
            :plugin-feeds:testReleaseUnitTest \
            :plugin-media:testReleaseUnitTest \
            :plugin-tasker:testReleaseUnitTest \
            :plugin-photosync:testReleaseUnitTest \
            :plugin-wireless-adb:testReleaseUnitTest \
            :plugin-sample:testReleaseUnitTest \
            -PskipCxrGlobal=true -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false

      - name: Verify the vendored Kadb sources
        run: python3 kadb-compat/verify_upstream.py

      - name: Run kadb-compat host tests
        run: ./gradlew :kadb-compat:testAndroidHostTest -PskipCxrGlobal=true

      - name: Check Patcher bundle preparation
        run: python3 -m unittest discover -s plugins/patcher/scripts

      - name: Run Patcher unit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || github.token }}
        run: ./gradlew :plugin-patcher:testReleaseUnitTest -PskipCxrGlobal=true -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false
